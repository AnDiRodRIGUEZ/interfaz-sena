<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>post</title>
</head>

<body>
    <header class="header-contend-post">
        <div class="title-section">
            <h1 class="title">Tus post</h1>
        </div>
    </header>
    <main class="post-contend-form">
        <div class="post-form">
            <form action="">
                <div class="post-form-title">
                    <label for="">
                        titulo del post
                    </label>
                </div>
                <div class="post-form-contend-text">
                    contenido del post
                </div>
                <div class="date-post">
                    <span class="date">fecha del post: 29 abril 2025</span>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer-actions">
        <div class="actions">
            <button class="btn-action">LIKE</button>
            <button class="btn-action">Dislike</button>
        </div>
    </footer>
</body>

</html>
