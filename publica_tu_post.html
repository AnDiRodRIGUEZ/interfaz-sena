<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>publica tu post</title>
</head>

<body>
    <header class="header-contend-post">
        <div class="header-searcher">
            <input type="text" placeholder="Buscar" class="header-searcher-input">
        </div>
        <div class="icon-person">
            <img src="./assets/person-male-svgrepo-com.png" alt="icon-person">
        </div>
    </header>
    <main class="post-contend-form">
        <div class="post-form">
            <form action="">
                <div class="post-form-title">
                    <input type="text" placeholder="Título" class="post-form-title" required>
                </div>
                <div class="post-form-contend-text">
                    <textarea name="" id="" required></textarea>
                </div>

            </form>
        </div>
    </main>
    <footer class="footer-actions">
        <div class="actions">
            <button class="btn-action">Volver</button>
            <button class="btn-action">Enviar</button>
        </div>
    </footer>
</body>

</html>
